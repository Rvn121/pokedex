<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Pokédex</title>

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      href="./assets/icons/pokeball favi.png"
    />

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <!-- Eigene CSS -->
     <link rel="stylesheet" href="./css/standard.css">
    <link rel="stylesheet" href="./style.css" />
  </head>

  <body class="d-flex flex-column min-vh-100">
    <!-- Header -->
    <header class="page-header">
      <div class="wide-content header-content">
        <div class="header-logo-area">
          <img
            src="./assets/img/pokedexlogo.png"
            alt="Pokédex logo"
            class="pokedex-logo"
          />
        </div>

        <div class="search-area">
          <input
            type="search"
            class="form-control search-input"
            placeholder="Search Pokémon..."
            aria-label="Search Pokémon"
            data-id="search-input"
            minlength="3"
          />

          <button
            class="btn btn-warning search-button"
            type="button"
            aria-label="Search Pokémon"
            data-id="search-button"
          >
            Search
          </button>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="page-content flex-grow-1" data-id="content">
      <div class="content-width content-area">
        <!-- Pokémon cards will be rendered here later -->
      </div>
    </main>

    <!-- Footer -->
    <footer class="page-footer">
      <div class="wide-content footer-content">
        <img
          src="./assets/img/Rouven-Logo.png"
          alt="Rouven Loske logo"
          class="footer-logo"
        />

        <p class="copyright">© 2026 by Rouven Loske</p>

        <a href="./imprint.html" class="footer-link">
          Imprint
        </a>
      </div>
    </footer>

    <!-- Bootstrap -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>

    <!-- Eigene JavaScript -->
    <script src="./script.js"></script>
  </body>
</html>
